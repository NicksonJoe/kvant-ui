<!doctype html>
<html lang="ru" data-accent="cobalt" data-mode="light" data-font="inter" data-shape="capsule" data-density="regular">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Kvant — библиотека интерфейсов: компоненты, основы и живые примеры." />
    <title>Kvant</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='5' fill='%231e1e21'/%3E%3Ccircle cx='20.6' cy='7.4' r='2.4' fill='%231c71e2'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved environment before first paint (no light flash). Mirrors packages/registry/theme.ts.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('kvant-theme') || '{}');
          var d = document.documentElement;
          var mode = t.mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t.mode;
          if (t.accent) d.setAttribute('data-accent', t.accent);
          if (mode) d.setAttribute('data-mode', mode);
          if (t.font) d.setAttribute('data-font', t.font);
          if (t.shape) d.setAttribute('data-shape', t.shape);
          if (t.density) d.setAttribute('data-density', t.density);
          if (t.reduceMotion) d.setAttribute('data-reduce-motion', '');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
